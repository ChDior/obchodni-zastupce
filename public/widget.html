<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online poradce</title>
  <link rel="stylesheet" href="/widget-assets/widget.css">
</head>
<body>
  <main class="chat">
    <header><strong id="brand">Online poradce</strong><span>Jsem AI asistent. Ceny, sklad a termíny vždy ověřuji v systému; o výjimkách rozhoduje obchodník.</span></header>
    <div id="log" class="log" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <input id="msg" maxlength="2000" placeholder="Napište dotaz, např. „Kolik tašek potřebuji na 100 m²?“" required>
      <button type="submit">Odeslat</button>
    </form>
  </main>
  <script src="/widget-assets/widget.js" defer></script>
</body>
</html>
